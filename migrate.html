<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Миграция</title>
    <style>
        body { background: #121212; color: white; font-family: Arial; text-align: center; padding: 50px; }
        button { padding: 15px 30px; font-size: 18px; background: #9d4edd; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        #log { margin-top: 20px; font-family: monospace; white-space: pre-wrap; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto; background: #1e1e1e; padding: 20px; border-radius: 8px;}
    </style>
</head>
<body>
    <h1>Перенос товаров в Firebase</h1>
    <button id="start-btn">Начать миграцию</button>
    <div id="log">Ожидание...</div>
    <script src="products.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_MGgecc7XzdMy93d2l_C2l11mBz_oRGU",
            authDomain: "tabachka-shop-f17fe.firebaseapp.com",
            projectId: "tabachka-shop-f17fe",
            storageBucket: "tabachka-shop-f17fe.firebasestorage.app",
            messagingSenderId: "304068875080",
            appId: "1:304068875080:web:cf4f97bb22ef1cc19b997d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const logDiv = document.getElementById("log");

        document.getElementById("start-btn").addEventListener("click", async () => {
            document.getElementById("start-btn").disabled = true;
            logDiv.innerText = "Начинаю загрузку...\n";
            let count = 0;
            for (const product of PRODUCTS) {
                try {
                    await addDoc(collection(db, "products"), { ...product, created_at: new Date() });
                    count++;
                    logDiv.innerText += `✅ Загружен: ${product.name}\n`;
                } catch (e) {
                    logDiv.innerText += `❌ Ошибка с ${product.name}\n`;
                }
            }
            logDiv.innerText += `\n🎉 ГОТОВО! Загружено товаров: ${count}`;
        });
    </script>
</body>
</html>
